<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAVA TYPE — Kinetic Typography Playground</title>
<style>
:root{
  --bg:#08080a; --panel:#101013; --panel2:#16161a; --panel3:#1e1e24;
  --line:#2c2c35; --line2:#202028;
  --txt:#d4d4dd; --dim:#a2a2b0; --dim2:#8b8b9e; --bright:#ffffff;
  --red:#ff2233; --red2:#a8101e; --pink:#ff3d84;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.45 var(--sans);user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#26262e;border:3px solid var(--panel);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a3a46}

#app{display:grid;grid-template-rows:46px minmax(0,1fr) 58px;grid-template-columns:310px minmax(0,1fr) 320px;height:100%;width:100%}

/* ---------------- TOPBAR ---------------- */
#topbar{grid-area:1/1/2/4;display:flex;align-items:stretch;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:50}
.brand{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--line);flex-shrink:0}
.brand .dot{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 9px 1px rgba(255,34,51,.85);animation:bp 3.4s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.brand b{font:600 12.5px/1 var(--mono);letter-spacing:.19em;color:var(--bright)}
.brand i{font:400 11px/1 var(--mono);color:var(--dim2);letter-spacing:.1em;font-style:normal;padding-top:2px}
.proj{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line)}
.proj input{background:0 0;border:1px solid transparent;padding:5px 7px;width:186px;font:400 12.5px/1 var(--mono);letter-spacing:.05em;color:var(--txt);outline:0;transition:.12s}
.proj input:hover{border-color:var(--line)}
.proj input:focus{border-color:var(--red2);background:#0a0a0c;color:var(--bright)}
.grp{display:flex;align-items:center;gap:3px;padding:0 9px;border-right:1px solid var(--line)}
.grp.nb{border-right:0}
.spacer{flex:1}
.tb{background:0 0;border:1px solid transparent;color:var(--dim);height:27px;min-width:27px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:400 11.5px/1 var(--mono);letter-spacing:.09em;transition:color .12s,background .12s,border-color .12s;white-space:nowrap}
.tb:hover{color:var(--bright);background:var(--panel3)}
.tb:active{transform:translateY(.5px)}
.tb.on{color:var(--red);border-color:var(--red2);background:rgba(255,34,51,.08)}
.tb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb svg.fill{fill:currentColor;stroke:none}
.tb.pri{background:var(--red);color:#fff;border-color:var(--red);font-weight:600;letter-spacing:.08em}
.tb.pri:hover{background:#ff3b4a;color:#fff}
.tb:disabled{opacity:.3;cursor:not-allowed}
.tbl{font:400 11px/1 var(--mono);letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;margin-right:3px}
select.mini{background:var(--panel2);border:1px solid var(--line);color:var(--txt);height:25px;padding:0 3px;font:400 11.5px/1 var(--mono);outline:0;cursor:pointer;letter-spacing:.05em}
select.mini:hover{border-color:#34343e}

/* ---------------- PANELS ---------------- */
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{grid-area:2/1/3/2;border-right:1px solid var(--line);z-index:20}
#right{grid-area:2/3/3/4;border-left:1px solid var(--line);z-index:20}
.ptabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0;background:#0b0b0d}
.ptab{flex:1 1 auto;min-width:62px;background:0 0;border:0;border-bottom:1.5px solid transparent;color:var(--dim2);padding:9px 4px 8px;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;transition:color .12s,border-color .12s;position:relative}
.ptab:hover{color:var(--txt)}
.ptab.on{color:var(--bright);border-bottom-color:var(--red)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain}
.pane{display:none}.pane.on{display:block}

.sec{border-bottom:1px solid var(--line2)}
.sech{width:100%;background:0 0;border:0;display:flex;align-items:center;gap:6px;padding:9px 11px;cursor:pointer;color:var(--dim);font:400 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;text-align:left;transition:color .12s}
.sech:hover{color:var(--txt)}
.sech .ch{width:0;height:0;border-left:3.5px solid currentColor;border-top:3px solid transparent;border-bottom:3px solid transparent;transition:transform .15s;flex-shrink:0;opacity:.65}
.sec.open .sech .ch{transform:rotate(90deg)}
.sech .cnt{margin-left:auto;font-size:11px;color:#35353f;letter-spacing:.08em}
.secb{padding:1px 11px 11px;display:none}
.sec.open .secb{display:block}

.row{display:grid;grid-template-columns:1fr auto;align-items:center;
  column-gap:8px;row-gap:3px;margin-bottom:9px;min-height:19px}
.row .slider{grid-column:1/-1}
.row:last-child{margin-bottom:0}
.row>label{font:400 11.5px/1.25 var(--mono);color:var(--txt);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .sl{flex:1;min-width:0}
.row .nv{font:500 11.5px/1 var(--mono);color:var(--bright);min-width:44px;
  text-align:right;flex-shrink:0;cursor:ew-resize;font-variant-numeric:tabular-nums}
.row .nv:hover{color:var(--bright)}
.row.full{flex-wrap:wrap}
.row.full>label{width:100%;margin-bottom:1px}

/* slider */
.slider{position:relative;height:15px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.slider .tk{position:absolute;left:0;right:0;height:2px;background:#26262e}
.slider .fl{position:absolute;left:0;top:0;bottom:0;background:var(--red);opacity:.9}
.slider .th{position:absolute;width:8px;height:8px;background:#c9c9d3;transform:translate(-50%,0) rotate(45deg);transition:background .1s,box-shadow .1s;pointer-events:none}
.slider:hover .th{background:#fff}
.slider.drag .th{background:var(--red);box-shadow:0 0 9px rgba(255,34,51,.85)}
.slider .dflt{position:absolute;width:1px;height:5px;background:#4a4a58;top:5px;pointer-events:none}

/* toggle */
.tg{grid-column:2;justify-self:end;width:28px;height:15px;background:#1e1e26;border:1px solid #2a2a34;position:relative;cursor:pointer;flex-shrink:0;transition:.14s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;background:#54545f;transition:.14s}
.tg.on{background:rgba(255,34,51,.2);border-color:var(--red2)}
.tg.on::after{transform:translateX(12px);background:var(--red)}

/* color */
.crow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.crow>span{font:400 11.5px/1 var(--mono);color:var(--dim);flex:1;letter-spacing:.02em}
.sw{width:24px;height:17px;border:1px solid #35353f;position:relative;overflow:hidden;flex-shrink:0;cursor:pointer}
.sw input{position:absolute;inset:-10px;width:250%;height:250%;opacity:0;cursor:pointer;border:0;padding:0}
.hex{background:var(--panel2);border:1px solid var(--line);color:#84848f;width:58px;height:19px;padding:0 3px;font:400 11px/1 var(--mono);outline:0;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.hex:focus{border-color:var(--red2);color:var(--bright)}

textarea#textin{width:100%;background:#0a0a0c;border:1px solid var(--line);color:var(--bright);font:400 12px/1.55 var(--mono);padding:8px 9px;resize:vertical;min-height:104px;outline:0;letter-spacing:.05em;tab-size:2}
textarea#textin:focus{border-color:var(--red2)}
input.txtin,select.selin{width:100%;background:#0a0a0c;border:1px solid var(--line);color:var(--txt);font:400 11.5px/1 var(--mono);padding:6px 7px;outline:0;letter-spacing:.03em}
input.txtin:focus,select.selin:focus{border-color:var(--red2)}
select.selin{cursor:pointer;height:26px}
.filebtn{display:block;width:100%;text-align:center;background:var(--panel2);border:1px dashed #2c2c36;color:var(--dim);padding:7px;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.12em;transition:.12s;margin-top:6px}
.filebtn:hover{border-color:var(--red2);color:var(--txt);background:#15151a}
.filebtn input{display:none}

.seg{display:flex;border:1px solid var(--line);background:#0a0a0c;width:100%}
.seg button{flex:1;background:0 0;border:0;border-right:1px solid var(--line);color:var(--dim);padding:5px 1px;cursor:pointer;font:400 11px/1.3 var(--mono);letter-spacing:.05em;transition:.11s;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt);background:var(--panel3)}
.seg button.on{background:rgba(255,34,51,.15);color:var(--red)}

.modecard{display:flex;border:1px solid var(--line);margin-bottom:9px}
.modecard button{flex:1;background:0 0;border:0;padding:7px 8px;cursor:pointer;color:var(--dim);border-right:1px solid var(--line);text-align:left;transition:.12s;line-height:1.25}
.modecard button:last-child{border-right:0}
.modecard button b{display:block;font:400 11px/1 var(--mono);letter-spacing:.11em;margin-bottom:3px}
.modecard button i{display:block;font:400 11px/1.35 var(--sans);font-style:normal;opacity:.55}
.modecard button:hover{background:var(--panel3)}
.modecard button.on{background:rgba(255,34,51,.1)}
.modecard button.on b{color:var(--red)}
.modecard button.on i{opacity:.75;color:var(--txt)}

.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.preset{background:#0b0b0e;border:1px solid var(--line);padding:0;cursor:pointer;overflow:hidden;transition:border-color .13s;text-align:left;display:block}
.preset:hover{border-color:#3b3b48}
.preset.on{border-color:var(--red)}
.preset .pv{width:100%;height:44px;display:block;background:#000}
.preset .pn{padding:4px 6px;font:400 11px/1.3 var(--mono);letter-spacing:.07em;color:var(--dim);border-top:1px solid var(--line2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset:hover .pn{color:var(--txt)}
.preset.on .pn{color:var(--red)}

/* ---------------- STAGE ---------------- */
#stage{grid-area:2/2/3/3;position:relative;background:#050506;overflow:hidden;min-width:0;display:flex;align-items:center;justify-content:center}
#stage.grid{background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:26px 26px;background-position:center}
#wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
#gl{display:block;background:#000;box-shadow:0 0 0 1px #1a1a20,0 20px 60px -18px rgba(0,0,0,.95)}
#nodraw{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);font:400 12px/1.7 var(--mono);text-align:center;padding:30px;letter-spacing:.06em}
#nodraw.show{display:flex}
#guides{position:absolute;pointer-events:none;display:none;box-shadow:0 0 0 1px rgba(255,34,51,.28)}
#guides.on{display:block}
#guides i{position:absolute;background:rgba(255,34,51,.26)}
#guides i.v{top:0;bottom:0;width:1px}
#guides i.h{left:0;right:0;height:1px}
.ov{position:absolute;pointer-events:none;font:400 11px/1 var(--mono);letter-spacing:.11em;color:#3e3e49;z-index:5;text-transform:uppercase}
.ov b{color:#75757f;font-weight:400}
#hudTL{top:9px;left:11px;display:flex;gap:13px;align-items:center}
#hudTR{top:9px;right:11px;text-align:right}
#hudBR{bottom:9px;right:11px;text-align:right}
#meters{display:flex;align-items:flex-end;gap:1.5px;height:10px}
#meters i{width:2px;background:var(--red);opacity:.85;display:block;height:2px}
#zoom{position:absolute;bottom:10px;left:11px;display:flex;align-items:center;background:rgba(10,10,12,.9);border:1px solid var(--line);z-index:6;backdrop-filter:blur(6px)}
#zoom button{background:0 0;border:0;color:var(--dim);width:23px;height:21px;cursor:pointer;font:400 12px/1 var(--mono);transition:.11s;display:flex;align-items:center;justify-content:center}
#zoom button:hover{color:var(--bright);background:#1a1a20}
#zoom .zv{font:400 11px/1 var(--mono);color:#82828f;min-width:34px;text-align:center;cursor:pointer;padding:0 2px}
#zoom .zv:hover{color:var(--bright)}

/* ---------------- TIMELINE ---------------- */
#timeline{grid-area:3/1/4/4;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:14px;z-index:30}
.tplay{width:27px;height:27px;background:0 0;border:1px solid var(--line);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;flex-shrink:0}
.tplay:hover{border-color:var(--red2);color:var(--red)}
.tplay svg{width:10px;height:10px;fill:currentColor}
.ttrack{flex:1;position:relative;height:100%;display:flex;align-items:center;cursor:pointer;min-width:0;touch-action:none}
.trail{position:absolute;left:0;right:0;height:2px;background:#1f1f27}
.tprog{position:absolute;left:0;height:2px;background:var(--red);box-shadow:0 0 9px rgba(255,34,51,.6)}
.thead{position:absolute;width:1.5px;height:14px;background:#fff;box-shadow:0 0 7px rgba(255,255,255,.75);transform:translateX(-.75px)}
.tticks{position:absolute;left:0;right:0;top:50%;pointer-events:none}
.tticks i{position:absolute;top:4px;width:1px;height:3px;background:#31313b;display:block}
.tticks i.maj{height:6px;top:3px;background:#42424f}
.tmeta{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ttime{font:400 11.5px/1 var(--mono);color:#7d7d89;letter-spacing:.05em;min-width:88px;font-variant-numeric:tabular-nums}
.ttime b{color:var(--bright);font-weight:400}
.tfield{display:flex;align-items:center;gap:5px}
.tfield span{font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.num{background:#0a0a0c;border:1px solid var(--line);color:var(--txt);width:46px;height:19px;padding:0 3px;font:400 11px/1 var(--mono);text-align:right;outline:0;font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--red2);color:var(--bright)}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------------- MODAL ---------------- */
#modal{position:fixed;inset:0;background:rgba(3,3,4,.82);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:200}
#modal.on{display:flex}
.mbox{width:420px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:0 50px 120px -20px #000}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead h2{margin:0;font:400 11.5px/1 var(--mono);letter-spacing:.22em;color:var(--bright);text-transform:uppercase}
.mbody{padding:15px;overflow-y:auto;flex:1;min-height:0}
.mfoot{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end;flex-shrink:0}
.xb{background:0 0;border:0;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.xb:hover{color:var(--bright)}
.btn{background:var(--panel3);border:1px solid var(--line);color:var(--txt);padding:7px 13px;cursor:pointer;font:400 11.5px/1 var(--mono);letter-spacing:.1em;transition:.12s}
.btn:hover{border-color:#3a3a46;color:var(--bright)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.pri:hover{background:#ff3b4a;color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.prog{height:2px;background:#1f1f27;margin:11px 0 7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .12s;box-shadow:0 0 8px var(--red)}
.pinfo{display:flex;justify-content:space-between;font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.07em}
.note{font:400 11px/1.7 var(--mono);color:#585862;margin-top:11px;padding:8px 9px;background:#0a0a0c;border-left:2px solid #2b2b35;letter-spacing:.02em}
.note.warn{border-left-color:#8a6a1c;color:#8b7642}
.note b{color:#8c8c98;font-weight:400}

#toast{position:fixed;bottom:70px;left:50%;transform:translate(-50%,10px);background:#101014;border:1px solid var(--line);border-left:2px solid var(--red);padding:8px 14px;font:400 11.5px/1 var(--mono);letter-spacing:.07em;color:var(--txt);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:300;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Presentation / fullscreen: the canvas owns the entire viewport. */
body.present #left,body.present #right,body.present #timeline,
body.present .ov,body.present #zoom,body.present #topbar,body.present #dtabs{display:none}
body.present #app{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
body.present #stage{grid-area:1/1/2/2}
body.present #wrap{background:#000}
#exitPresent{display:none;position:fixed;top:12px;right:12px;z-index:400;
  background:rgba(10,10,13,.82);border:1px solid var(--line);color:var(--txt);
  font:500 12px/1 var(--mono);letter-spacing:.12em;padding:9px 14px;cursor:pointer;
  backdrop-filter:blur(6px);transition:.14s}
#exitPresent:hover{color:#fff;border-color:var(--red);background:rgba(200,20,40,.85)}
body.present #exitPresent{display:block}

#dtabs{display:none}
@media(max-width:1180px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) 58px}
  #left,#right{position:fixed;top:46px;bottom:58px;width:282px;box-shadow:0 0 50px #000;z-index:60;transition:transform .22s cubic-bezier(.4,0,.2,1)}
  #left{left:0;transform:translateX(-102%)}
  #right{right:0;transform:translateX(102%)}
  #left.open,#right.open{transform:translateX(0)}
  #stage{grid-area:2/1/3/2}
  .proj input{width:104px}
  #dtabs{display:flex;position:absolute;top:7px;z-index:8;gap:4px}
  #dtabs.l{left:7px}
  #dtabs.r{right:7px}
  .dt{background:rgba(10,10,12,.92);border:1px solid var(--line);width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer}
  .dt:hover{color:var(--bright)}
  .brand i,.grp .lbl{display:none}
}
@media(max-width:820px){
  .proj{display:none}
  #hudTR{display:none}
}
.hide{display:none!important}

/* ===================== TRANCE / PARTY MODE ===================== */
.mast{background:#0a0a0c;border:1px solid #1d1d24;padding:9px 10px;margin-bottom:9px;transition:.16s}
.mast.live{border-color:rgba(255,34,51,.42);background:linear-gradient(180deg,rgba(255,34,51,.09),rgba(255,34,51,.02))}
.mast.party.live{border-color:rgba(255,60,180,.45);background:linear-gradient(180deg,rgba(255,60,180,.10),rgba(120,0,255,.03))}
.mastrow{display:flex;align-items:center;justify-content:space-between;font:500 11px/1 var(--mono);letter-spacing:.15em;color:var(--txt)}
.mast.live .mastrow{color:var(--bright)}
.mastsub{font:400 11px/1.5 var(--mono);letter-spacing:.09em;color:#484852;margin-top:6px}
.mast.live .mastsub{color:#9a5a62}
.mast.party.live .mastsub{color:#a05a86}

.macroGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.macro{position:relative;height:66px;background:#0a0a0c;border:1px solid #1b1b22;overflow:hidden;cursor:ns-resize;touch-action:none;user-select:none}
.macro:hover{border-color:#33333f}
.macro.drag{border-color:var(--red2)}
.macroFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(255,34,51,.42),rgba(255,34,51,.06));transition:height .04s linear}
.macroIn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:5px 5px 4px}
.macroIn b{font:400 11px/1.2 var(--mono);letter-spacing:.04em;color:#c2c2d0;font-weight:500;text-transform:uppercase}
.macroIn s{font:500 12px/1 var(--mono);color:var(--bright);text-decoration:none;letter-spacing:-.02em}

.meterWrap{display:flex;flex-direction:column;gap:3px;margin:8px 0 10px;padding:7px 8px;background:#0a0a0c;border:1px solid #17171d}
.mrow{display:flex;align-items:center;gap:7px;height:7px}
.mrow span{font:400 11px/1 var(--mono);letter-spacing:.12em;color:#4a4a55;width:30px;flex-shrink:0}
.mrow i{flex:1;height:3px;background:#16161c;position:relative;overflow:hidden}
.mrow i::after{content:'';position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--red),var(--pink));transition:width .05s linear}

.locks{margin-top:9px;padding:8px 9px;background:#0a0a0c;border:1px solid #17171d}
.lockTitle{font:400 11px/1 var(--mono);letter-spacing:.15em;color:#454550;margin-bottom:7px}
.lockRow{display:flex;align-items:center;gap:6px;padding:2.5px 0;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.06em;color:#7a7a86}
.lockRow:hover{color:var(--txt)}
.lockRow input{accent-color:var(--red);width:11px;height:11px;cursor:pointer;margin:0}

.btn.insane{background:linear-gradient(90deg,#ff1f3d,#ff2f9d 55%,#8b2bff);border-color:transparent;color:#fff;font-weight:600}
.btn.insane:hover{filter:brightness(1.18) saturate(1.1)}
.btn.insane:active{transform:translateY(1px)}

.tb.dim{opacity:.32}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.prCard{position:relative;background:#0a0a0c;border:1px solid #1a1a21;padding:0;cursor:pointer;overflow:hidden;text-align:left;transition:.13s}
.prCard:hover{border-color:#3a3a48}
.prCard.on{border-color:var(--red2)}
.prCard canvas{display:block;width:100%;height:auto;background:#000}
.prCard .prn{font:400 11px/1.3 var(--mono);letter-spacing:.09em;color:#8e8e9c;padding:4px 5px 5px;text-transform:uppercase;border-top:1px solid #17171d}
.prCard:hover .prn{color:var(--bright)}

.audioStatus{display:flex;align-items:center;gap:6px;font:400 11px/1 var(--mono);letter-spacing:.1em;color:#585862;padding:6px 8px;background:#0a0a0c;border:1px solid #17171d;margin-bottom:8px}
.audioStatus i{width:5px;height:5px;border-radius:50%;background:#2a2a34;flex-shrink:0}
.audioStatus.live i{background:var(--red);box-shadow:0 0 6px var(--red)}
.audioStatus.live{color:#a0a0ac}

#scope{display:block;width:100%;height:44px;background:#070709;border:1px solid #17171d;margin:8px 0}

/* ===================== AUDIO / CURSOR PANELS ===================== */
.srcGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:6px}
.srcBtn{background:#0a0a0c;border:1px solid #1b1b22;padding:7px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;align-items:center;transition:.12s}
.srcBtn:hover{border-color:#3a3a48;background:#111116}
.srcBtn:active{transform:translateY(1px)}
.srcBtn b{font:500 11px/1 var(--mono);letter-spacing:.08em;color:#9a9aa6;text-align:center}
.srcBtn s{font:400 11px/1 var(--mono);letter-spacing:.05em;color:#45454f;text-decoration:none}
.srcBtn:hover b{color:var(--bright)}
.readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:6px 0 2px}
.rio{background:#0a0a0c;border:1px solid #16161c;padding:5px 6px;display:flex;
  flex-direction:column;gap:3px}
.rio span{font:400 11px/1 var(--mono);letter-spacing:.1em;color:#43434e}
.rio b{font:500 12.5px/1 var(--mono);color:var(--bright);letter-spacing:-.02em}
.mapGrid{display:flex;flex-direction:column;gap:5px}
.mapRow{display:flex;align-items:center;gap:7px}
.mapRow span{font:400 11px/1.3 var(--mono);letter-spacing:.07em;color:#6a6a76;width:96px;flex-shrink:0}
.mapRow input{flex:1;height:2px;-webkit-appearance:none;appearance:none;background:#20202a;outline:0}
.mapRow input::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;
  background:var(--red);border-radius:50%;cursor:pointer}
.mapRow input::-moz-range-thumb{width:8px;height:8px;background:var(--red);
  border:0;border-radius:50%;cursor:pointer}
.mapRow b{font:500 11px/1 var(--mono);color:#9a9aa6;width:20px;text-align:right}

/* ===================== MODE SWITCHES (topbar) ===================== */
.modes{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);flex-shrink:0}
.modebtn{display:flex;align-items:center;gap:7px;background:var(--panel3);border:1px solid var(--line);
  color:var(--txt);padding:0 12px;height:30px;cursor:pointer;font:500 12px/1 var(--mono);
  letter-spacing:.11em;text-transform:uppercase;transition:.14s;white-space:nowrap;position:relative}
.modebtn:hover{border-color:#4a4a58;color:var(--bright);background:#26262e}
.modebtn .led{width:7px;height:7px;border-radius:50%;background:#3a3a46;flex-shrink:0;transition:.14s}
.modebtn.on{color:#fff;border-color:transparent}
.modebtn.on .led{box-shadow:0 0 8px 1px currentColor}
.modebtn .kbd{margin-left:5px;opacity:.45;font-size:10px;letter-spacing:0}

#mTrance.on{background:linear-gradient(180deg,#c2182a,#8f0f1e);box-shadow:0 0 0 1px rgba(255,60,80,.5),0 0 16px rgba(255,34,51,.35)}
#mTrance.on .led{background:#fff}
#mParty.on{background:linear-gradient(90deg,#ff1f3d,#ff2f9d 55%,#8b2bff);box-shadow:0 0 0 1px rgba(255,80,180,.45),0 0 16px rgba(255,47,157,.35)}
#mParty.on .led{background:#fff}
#mAudio.on{background:linear-gradient(180deg,#0f7f6a,#0a5c4d);box-shadow:0 0 0 1px rgba(60,255,210,.4),0 0 16px rgba(30,220,180,.3)}
#mAudio.on .led{background:#57ffd8}
#mAudio.listening .led{animation:audpulse 1.05s ease-in-out infinite}
@keyframes audpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

/* Narrow screens: shrink the mode bar rather than hiding it — the three
   master switches must always be reachable. */
@media (max-width:1320px){
  .modes{gap:4px;padding:0 7px}
  .modebtn{padding:0 8px;letter-spacing:.05em;font-size:11px}
  .modebtn .kbd{display:none}
}
@media (max-width:1180px){
  .brand i,.tbl{display:none}
  .modes{padding:0 6px;gap:4px}
  .modebtn{padding:0 9px;letter-spacing:.03em;font-size:11px}
  .modebtn .kbd{display:none}
}
/* The three master switches stay on screen at every width — they are the
   primary controls, so they shrink to LED-only rather than disappearing. */
@media (max-width:820px){
  .proj,.tb#btnSave,.tb#btnLoad,.tb#btnPresent,#btnRestart{display:none}
  .modes{padding:0 4px;gap:3px}
  .modebtn{padding:0 7px;font-size:10.5px}
  .modebtn .led{width:6px;height:6px}
}

/* ===================== PRESET BROWSER ===================== */
.pfRow{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:5px}
.pfBtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  padding:8px 2px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.05em;
  transition:.12s;text-transform:uppercase}
.pfBtn:hover{color:var(--bright);border-color:#4a4a58}
.pfBtn.on{background:var(--red);border-color:var(--red);color:#fff}
.pfBtn[data-f="flash"].on{background:#c4720a;border-color:#c4720a}
.pfBtn[data-f="safe"].on{background:#1c7a5e;border-color:#1c7a5e}
.pgRow{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px}
.pgBtn{flex:1 1 auto;background:0 0;border:1px solid var(--line);color:var(--dim);
  padding:6px 7px;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.04em;
  transition:.12s;white-space:nowrap}
.pgBtn:hover{color:var(--bright);background:var(--panel3)}
.pgBtn.on{color:var(--bright);border-color:#5a5a6a;background:var(--panel3)}
.flashBanner{display:none;background:rgba(196,114,10,.12);border:1px solid rgba(255,170,40,.45);
  border-left:3px solid #ffaa28;padding:10px 11px;margin-bottom:9px}
.flashBanner.on{display:block}
.flashBanner b{display:block;font:600 11.5px/1.3 var(--mono);letter-spacing:.09em;
  color:#ffc761;margin-bottom:6px}
.flashBanner span{display:block;font:400 11px/1.6 var(--mono);color:#c9b591;margin-bottom:8px}
.flashBanner button{width:100%;background:#ffaa28;border:0;color:#1a1000;cursor:pointer;
  padding:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;transition:.12s}
.flashBanner button:hover{background:#ffc761}
.tierHead{grid-column:1/-1;display:flex;align-items:center;gap:7px;margin:11px 0 2px;
  font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.tierHead:first-child{margin-top:0}
.tierHead span{display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;background:var(--panel3);border:1px solid var(--line);
  color:var(--bright);font-size:11px}
.tierHead i{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:1px;opacity:.55}
.tierHead.t1 span{background:#1c7a5e;border-color:#1c7a5e;color:#fff}
.tierHead.t2 span{background:#2f6f9e;border-color:#2f6f9e;color:#fff}
.tierHead.t3 span{background:#8a6a1c;border-color:#8a6a1c;color:#fff}
.tierHead.t4 span{background:#a8451c;border-color:#a8451c;color:#fff}
.tierHead.t5 span{background:var(--red);border-color:var(--red);color:#fff}
.prCard{position:relative}
.flashBadge{position:absolute;top:4px;right:4px;width:19px;height:19px;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  background:rgba(0,0,0,.78);border:1px solid #c4720a;color:#ffc761;z-index:2}
.flashBadge.f2{background:rgba(196,30,30,.85);border-color:#ff5555;color:#fff}
.prn{display:flex;align-items:center;gap:4px}
.prn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prn .tierTag{font-style:normal;font-size:10px;color:#7c7c8d;flex-shrink:0}
.prCard.on .prn .tierTag{color:#ffb0b8}
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="dot"></span><b>LAVA TYPE</b><i>1.0</i></div>
    <div class="modes" id="modeBar">
      <button class="modebtn" id="mTrance" title="Trance mode — psychedelic effect stack (T)">
        <i class="led"></i><span>TRANCE</span><span class="kbd">T</span>
      </button>
      <button class="modebtn" id="mParty" title="Party mode — macro control surface (Y)">
        <i class="led"></i><span>PARTY</span><span class="kbd">Y</span>
      </button>
      <button class="modebtn" id="mAudio" title="Audio reactive — analyse tab, mic or file (U)">
        <i class="led"></i><span>AUDIO</span><span class="kbd">U</span>
      </button>
    </div>
    <div class="proj"><input id="projName" value="DARK CLOUD BREAKS" spellcheck="false" aria-label="Project name"></div>
    <div class="grp">
      <button class="tb" id="btnReset" title="Reset composition"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.2v5h5"/></svg><span class="lbl">RESET</span></button>
    </div>
    <div class="grp">
      <button class="tb" id="btnPlay" title="Play / Pause — Space"><svg viewBox="0 0 24 24" class="fill" id="icoPlay"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
      <button class="tb" id="btnRestart" title="Restart — R"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.2v5h5"/></svg></button>
    </div>
    <div class="grp">
      <span class="tbl">Qual</span>
      <select class="mini" id="qualitySel" title="Preview render quality">
        <option value="0.5">½ DRAFT</option>
        <option value="0.75">¾ LOW</option>
        <option value="1" selected>1× FULL</option>
        <option value="1.5">1.5× HIGH</option>
      </select>
    </div>
    <div class="grp">
      <button class="tb" id="btnGrid" title="Grid — G"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
      <button class="tb" id="btnGuides" title="Safe guides — '"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><rect x="8.5" y="8.5" width="7" height="7"/></svg></button>
      <button class="tb" id="btnFull" title="Fullscreen — F"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="tb" id="btnPresent" title="Presentation mode — H"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.4"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="tb" id="btnUndo" title="Undo — Ctrl+Z"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb" id="btnRedo" title="Redo — Ctrl+Shift+Z"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="btnSave" title="Save composition as JSON"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
      <button class="tb" id="btnLoad" title="Load composition JSON"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg></button>
    </div>
    <div class="grp nb">
      <button class="tb" id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M3 17v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3"/></svg><span class="lbl">EXPORT</span></button>
      <button class="tb pri" id="btnPng" title="Quick PNG">PNG</button>
    </div>
  </header>

  <aside id="left">
    <div class="ptabs" id="leftTabs">
      <button class="ptab on" data-tab="type">Type</button>
      <button class="ptab" data-tab="motion">Motion</button>
      <button class="ptab" data-tab="trance">Trance</button>
      <button class="ptab" data-tab="audio">Audio</button>
      <button class="ptab" data-tab="presets">Presets</button>
    </div>
    <div class="pbody" id="leftBody"></div>
  </aside>

  <main id="stage">
    <div id="wrap"><canvas id="gl"></canvas></div>
    <button id="exitPresent" title="Exit presentation — Esc">EXIT ✕</button>
    <div id="nodraw"><span>WEBGL2 UNAVAILABLE</span><span style="color:#43434e">This composition requires WebGL2 with float render targets.<br>Try Chrome, Edge, or Firefox with hardware acceleration enabled.</span></div>
    <div id="guides">
      <i class="v" style="left:5%"></i><i class="v" style="left:95%"></i>
      <i class="h" style="top:5%"></i><i class="h" style="top:95%"></i>
      <i class="v" style="left:50%;opacity:.35"></i><i class="h" style="top:50%;opacity:.35"></i>
    </div>
    <div id="dtabs" class="l"><div class="dt" id="dtL">☰</div></div>
    <div id="dtabs" class="r" style="left:auto;right:7px"><div class="dt" id="dtR">☷</div></div>
    <div class="ov" id="hudTL">
      <span id="meters"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span>FPS <b id="fpsv">—</b></span>
      <span>GPU <b id="gpuv">—</b></span>
    </div>
    <div class="ov" id="hudTR"><b id="resv">—</b></div>
    <div class="ov" id="hudBR">SEED <b id="seedv">—</b></div>
    <div id="zoom">
      <button id="zOut" title="Zoom out">−</button>
      <span class="zv" id="zVal">FIT</span>
      <button id="zIn" title="Zoom in">+</button>
      <button id="zFit" title="Fit">⤢</button>
    </div>
  </main>

  <aside id="right">
    <div class="ptabs" id="rightTabs">
      <button class="ptab on" data-tab="party">Party</button>
      <button class="ptab" data-tab="liquid">Liquid</button>
      <button class="ptab" data-tab="cursor">Cursor</button>
      <button class="ptab" data-tab="color">Color</button>
      <button class="ptab" data-tab="comp">Comp</button>
      <button class="ptab" data-tab="out">Out</button>
    </div>
    <div class="pbody" id="rightBody"></div>
  </aside>

  <footer id="timeline">
    <button class="tplay" id="tlPlay" title="Play / Pause"><svg viewBox="0 0 24 24" id="tlIco"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
    <div class="ttrack" id="tlTrack">
      <div class="trail"></div>
      <div class="tprog" id="tlProg" style="width:0"></div>
      <div class="tticks" id="tlTicks"></div>
      <div class="thead" id="tlHead" style="left:0"></div>
    </div>
    <div class="tmeta">
      <div class="ttime"><b id="tlNow">0.00</b> / <span id="tlDur">8.00</span>s</div>
      <div class="tfield"><span>Loop</span><input class="num" id="loopDur" type="number" value="8" min="1" max="60" step="0.5"></div>
      <div class="tfield"><span>Spd</span><input class="num" id="playSpeed" type="number" value="1" min=".05" max="4" step=".05"></div>
    </div>
  </footer>
</div>

<div id="modal">
  <div class="mbox">
    <div class="mhead"><h2 id="mTitle">Export</h2><button class="xb" id="mX">✕</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<div id="toast"></div>
<div id="errbox" style="position:fixed;left:0;right:0;bottom:0;max-height:42%;overflow:auto;background:#2a0508;border-top:1px solid #7a1020;color:#ff9aa8;font:400 12px/1.5 var(--mono);padding:9px 12px;white-space:pre-wrap;z-index:999;display:none"></div>
<script>
window.__errs = [];
function __logErr(msg){
  window.__errs.push(msg);
  const b = document.getElementById('errbox');
  if (b){ b.style.display='block'; b.textContent = window.__errs.slice(-6).join('\n\n'); }
}
window.addEventListener('error', e => __logErr('ERROR: ' + (e.message||'') + '\n' + (e.filename||'') + ':' + (e.lineno||'') + (e.error && e.error.stack ? '\n' + e.error.stack : '')));
window.addEventListener('unhandledrejection', e => __logErr('REJECTION: ' + (e.reason && (e.reason.stack||e.reason.message) || e.reason)));
</script>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="fileAudio" accept="audio/*" hidden>
<canvas id="dl" hidden></canvas>

<script>
/*~~CORE~~*/
</script>
<script>
/*~~UI~~*/
</script>
</body>
</html>
